name: tests

on:
  push:
  pull_request:

jobs:
  poller:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: poller } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  web-backend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web/backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  web-frontend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web/frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm, cache-dependency-path: web/frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck -S warning install.sh deploy/solis-monitor deploy/tests/test-install.sh
      - run: bash deploy/tests/test-install.sh

  umbrel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: pip install pyyaml
      - run: python3 deploy/tests/check-umbrel-app.py
      - run: shellcheck -S warning --shell=bash vtlvolkov-solis-monitor/exports.sh vtlvolkov-solis-monitor/hooks/pre-start deploy/tests/test-umbrel-app.sh
      - run: bash deploy/tests/test-umbrel-app.sh

