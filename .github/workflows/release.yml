name: release

# Pushing a tag like v1.2.0 publishes the poller and web images (amd64 + arm64) to GitHub's container
# registry and a GitHub release with install.sh attached. The Dockerfiles run the test suites, so a
# release with failing tests is never published.
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write       # create the release
  packages: write       # push the images

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: poller, context: poller }
          - { name: web, context: web }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          echo "image=ghcr.io/${owner}/solis-monitor-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the version into install.sh
        run: |
          sed "s|^DEFAULT_VERSION=.*|DEFAULT_VERSION=\"${{ github.ref_name }}\"|" install.sh > install-release.sh
          grep -q "^DEFAULT_VERSION=\"${{ github.ref_name }}\"" install-release.sh
          mv install-release.sh install.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" install.sh docker-compose.yml \
            --title "${{ github.ref_name }}" --generate-notes --verify-tag
