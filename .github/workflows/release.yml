name: release

# Pushing a tag like v1.2.0 publishes the poller and web images (amd64 + arm64) to GitHub's container
# registry and a GitHub release with install.sh and the Android TV app (solis-tv.apk) attached. The Dockerfiles run the test suites, so a
# release with failing tests is never published.
#
# A tag with a suffix, like v1.2.0-rc.1, is a test release: it is marked as a pre-release and its images are
# not tagged latest, so nightly updates, the dashboard's update badge and new installs (which all ask GitHub
# for the latest release) never pick it. Install it on one site with: solis-monitor update --version v1.2.0-rc.1
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:          # "Run workflow" in the Actions tab: builds the images and the APK but publishes nothing (a dry run)
    inputs:
      store_tag:
        description: "Also try pinning this existing release (like v0.1.14) in the Umbrel store; nothing is pushed"
        required: false
        default: ""

permissions:
  contents: write       # create the release
  packages: write       # push the images

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { name: poller, context: poller }
          - { name: web, context: web }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          echo "image=ghcr.io/${owner}/solis-monitor-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}      # a manual run only checks that everything builds
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ !contains(github.ref_name, '-') && format('{0}:latest', steps.meta.outputs.image) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p android/.keystore
            echo "$KEYSTORE_B64" | base64 -d > android/.keystore/debug.keystore
          else
            echo "::warning::ANDROID_KEYSTORE_B64 is not set: this APK gets a new signing key and will not install over an earlier release"
          fi
      - name: Build the APK (its unit tests run first)
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then APP_VERSION="${GITHUB_REF_NAME#v}"; else APP_VERSION="0.0.1"; fi
          APP_VERSION="$APP_VERSION" sh android/build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: solis-tv-apk
          path: android/dist/solis-tv.apk

  release:
    needs: [images, apk]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: solis-tv-apk
      - name: Stamp the version into install.sh
        run: |
          sed "s|^DEFAULT_VERSION=.*|DEFAULT_VERSION=\"${{ github.ref_name }}\"|" install.sh > install-release.sh
          grep -q "^DEFAULT_VERSION=\"${{ github.ref_name }}\"" install-release.sh
          mv install-release.sh install.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "${{ github.ref_name }}" in *-*) pre="--prerelease" ;; esac
          # The tag message after its first line (the Umbrel update text) is the written summary; the commit list follows it.
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}" || true
          git tag -l --format='%(contents:body)' "${{ github.ref_name }}" > summary.md || : > summary.md
          notes=""; grep -q "[^[:space:]]" summary.md && notes="--notes-file summary.md"
          gh release create "${{ github.ref_name }}" install.sh docker-compose.yml solis-tv.apk \
            --title "${{ github.ref_name }}" $notes --generate-notes --verify-tag $pre

  # umbrelOS offers an app update once the store's manifest names the new version with the new images' digests.
  # Runs after a normal release (not a test release with a suffix, not a dry run) and after the images exist.
  umbrel-store:
    needs: [images, release]
    if: ${{ !cancelled() && needs.images.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') && ((github.ref_type == 'tag' && !contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && inputs.store_tag != '')) }}
    runs-on: ubuntu-24.04
    concurrency: umbrel-store            # two quick releases pin one after the other
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.store_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main                      # the store lives on main, not on the tag
          fetch-depth: 0
      - run: pip install pyyaml
      - name: Pin the release in the store
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          notes="$(git tag -l --format='%(contents:subject)' "$TAG" | sed -E 's/^v[0-9]+\.[0-9]+\.[0-9]+: *//')"
          [ -n "$notes" ] || notes="Version ${TAG#v}."
          python3 deploy/umbrel/update-app.py "$TAG" --notes "$notes"
          python3 deploy/tests/check-umbrel-app.py
          bash deploy/tests/test-umbrel-app.sh
          git --no-pager diff --stat
      - name: Commit and push
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "The store already points at ${TAG}."; exit 0; fi
          git commit -m "Umbrel app: pin the ${TAG} images"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main            # main moved while we worked: try again on top of it
          done
          echo "::error::could not push the store update; run deploy/umbrel/update-app.py ${TAG} by hand"
          exit 1

