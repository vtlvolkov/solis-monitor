name: release

# Pushing a tag like v1.2.0 publishes the poller and web images (amd64 + arm64) to GitHub's container
# registry and a GitHub release with install.sh and the Android TV app (solis-tv.apk) attached. The Dockerfiles run the test suites, so a
# release with failing tests is never published.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:          # "Run workflow" in the Actions tab: builds the images and the APK but publishes nothing (a dry run)

permissions:
  contents: write       # create the release
  packages: write       # push the images

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { name: poller, context: poller }
          - { name: web, context: web }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          echo "image=ghcr.io/${owner}/solis-monitor-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}      # a manual run only checks that everything builds
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p android/.keystore
            echo "$KEYSTORE_B64" | base64 -d > android/.keystore/debug.keystore
          else
            echo "::warning::ANDROID_KEYSTORE_B64 is not set: this APK gets a new signing key and will not install over an earlier release"
          fi
      - name: Build the APK (its unit tests run first)
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then APP_VERSION="${GITHUB_REF_NAME#v}"; else APP_VERSION="0.0.1"; fi
          APP_VERSION="$APP_VERSION" sh android/build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: solis-tv-apk
          path: android/dist/solis-tv.apk

  release:
    needs: [images, apk]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: solis-tv-apk
      - name: Stamp the version into install.sh
        run: |
          sed "s|^DEFAULT_VERSION=.*|DEFAULT_VERSION=\"${{ github.ref_name }}\"|" install.sh > install-release.sh
          grep -q "^DEFAULT_VERSION=\"${{ github.ref_name }}\"" install-release.sh
          mv install-release.sh install.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" install.sh docker-compose.yml solis-tv.apk \
            --title "${{ github.ref_name }}" --generate-notes --verify-tag
