manifestVersion: 1.1
id: vtlvolkov-solis-monitor
storage:
  dataRoot: data
category: automation
name: Solis Monitor
version: "0.2.2"
tagline: Live dashboard, history and alerts for Solis hybrid inverters
icon: https://raw.githubusercontent.com/vtlvolkov/solis-monitor/main/vtlvolkov-solis-monitor/icon.svg
description: >-
  A self-hosted dashboard for Solis hybrid inverters (tested with the S6-EH1P). It reads the inverter's data logger over your
  home network and keeps the history locally: live power flow between solar, grid, battery and house, charts from one hour to
  30 days, grid outages with how far the battery fell, the backup runtime estimate, electricity cost with day and night rates,
  and optional Telegram alerts.


  Before it can show data, tell it where the inverter's data logger is: open Settings, General, Inverter connection, type the
  logger's IP address or press Find inverter. The logger accepts only one connection at a time, so stop anything else that reads
  it (Home Assistant, another monitor).


  The dashboard is open on your home network. The Settings page asks for the login shown in this app's page in umbrelOS
  (user admin). Changing inverter settings from the dashboard is off by default.
developer: vtlvolkov
website: https://github.com/vtlvolkov/solis-monitor
dependencies: []
repo: https://github.com/vtlvolkov/solis-monitor
support: https://github.com/vtlvolkov/solis-monitor/issues
port: 8188
gallery:
  - https://raw.githubusercontent.com/vtlvolkov/solis-monitor/main/docs/img/store/overview.png
  - https://raw.githubusercontent.com/vtlvolkov/solis-monitor/main/docs/img/store/charts.png
  - https://raw.githubusercontent.com/vtlvolkov/solis-monitor/main/docs/img/store/cost.png
  - https://raw.githubusercontent.com/vtlvolkov/solis-monitor/main/docs/img/store/tv.png
path: ""
defaultUsername: admin
deterministicPassword: true
releaseNotes: |-
  Settings → Debug tab to read inverter registers by hand

  A new Debug tab (Settings → Debug) asks the inverter for registers and shows exactly what it answers.

  - Read input (function 04) or holding (function 03) registers, 1–50 at a time, from a decimal or 0x address.
  - See the request and the answer as hex, the round trip time, and each register as hex, unsigned, signed, text and 32-bit values. A Modbus refusal such as "Illegal data address" is shown as the answer.
  - Copy the result as text for a bug report.
  - Read-only: nothing here can change a setting. Needs the dashboard password, not CONTROL_ENABLED.
submitter: vtlvolkov
submission: https://github.com/vtlvolkov/solis-monitor
