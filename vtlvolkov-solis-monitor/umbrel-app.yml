path: ""
defaultUsername: admin
deterministicPassword: true
releaseNotes: |-
  batteries in parallel, time to full charge, and a quicker backup runtime

  - Devices → Battery shows an estimate of the batteries in parallel, for Dyness batteries. The inverter has no register for the count, so it comes from the BMS discharge limit ÷ 100 A. It can read low or disappear while the BMS lowers its limit, and it never changes the saved capacity.
  - While charging, the battery card shows the time to a full charge next to "Charging", from the capacity, the Max charge SOC and the average charging power over the last 15 minutes. It moves with clouds and can read short near full.
  - Backup runtime now follows the load faster: it uses the last 15 minutes of load, refreshed every minute, instead of the last hour refreshed every 5 minutes.
submitter: vtlvolkov
