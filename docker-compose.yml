services:
  influxdb:
    image: influxdb:2.7
    container_name: solis-influxdb
    restart: unless-stopped
    # No published port: only the poller and web services reach it, over the Docker network.
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUX_RETENTION:-0}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  poller:
    image: ${SOLIS_IMAGE_PREFIX:-solis-monitor}-poller:${SOLIS_VERSION:-latest}
    build: ./poller
    container_name: solis-poller
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      INVERTER_HOST: ${INVERTER_HOST:-}                 # the first address; the Settings page can save another (in poller-data)
      INVERTER_FILE: /data/inverter.json
      INVERTER_PORT: ${INVERTER_PORT:-502}
      MODBUS_UNIT: ${MODBUS_UNIT:-1}
      POLL_INTERVAL: ${POLL_INTERVAL:-10}
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_BUCKET_1M: ${INFLUX_BUCKET_1M:-}             # 1-minute aggregates (default <bucket>_1m), kept by an InfluxDB task the poller sets up
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-90}       # 10-second readings older than this are deleted (the aggregates stay); 0 = keep all
      RETENTION_FILE: /data/retention.json                # the same, changed on Settings -> System (wins over RAW_RETENTION_DAYS)
      # Settings page: internal control API on :8780 (Docker network only, not published). CONTROL_TOKEN is the secret
      # the web service presents to it; installs from before it existed have only INFLUX_TOKEN, used by both sides then.
      CONTROL_TOKEN: ${CONTROL_TOKEN:-${INFLUX_TOKEN}}
      CONTROL_ENABLED: ${CONTROL_ENABLED:-false}
      CURRENT_SCALE: ${CURRENT_SCALE:-0.1}
      MAX_CHARGE_CURRENT_A: ${MAX_CHARGE_CURRENT_A:-0}
      MAX_DISCHARGE_CURRENT_A: ${MAX_DISCHARGE_CURRENT_A:-0}
      MIN_WRITE_INTERVAL_S: ${MIN_WRITE_INTERVAL_S:-60}
      BATTERY_CAPACITY_KWH: ${BATTERY_CAPACITY_KWH:-}   # the Settings page can override it (saved in poller-data)
      CAPACITY_FILE: /data/battery-capacity.json
      EVENTS_FILE: /data/events.json                    # outages/alarms in progress, so a restart does not lose or repeat them
      MQTT_FILE: /data/mqtt.json                        # the broker set on Settings -> System (wins over MQTT_*)
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TLS: ${MQTT_TLS:-}
      MQTT_PREFIX: ${MQTT_PREFIX:-}
      MQTT_INTERVAL: ${MQTT_INTERVAL:-}
      MQTT_DISCOVERY: ${MQTT_DISCOVERY:-}
      MQTT_DISCOVERY_PREFIX: ${MQTT_DISCOVERY_PREFIX:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERT_SOC_LEVELS: ${ALERT_SOC_LEVELS:-50,30,20}
      ALERT_OFFLINE_MIN: ${ALERT_OFFLINE_MIN:-5}
      ALERT_CLOCK_DRIFT_MIN: ${ALERT_CLOCK_DRIFT_MIN:-5}
      SITE_NAME: ${SITE_NAME:-}
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - poller-data:/data     # the logger address and battery capacity saved from the Settings page, events in progress

  web:
    image: ${SOLIS_IMAGE_PREFIX:-solis-monitor}-web:${SOLIS_VERSION:-latest}
    build: ./web
    container_name: solis-web
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8088}:8088"
    environment:
      INFLUX_URL: http://influxdb:8086
      # The dashboard only reads: a read-only token (`solis-monitor secure-tokens` makes one) when .env has it, else the admin token
      INFLUX_TOKEN: ${INFLUX_READ_TOKEN:-${INFLUX_TOKEN}}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_BUCKET_1M: ${INFLUX_BUCKET_1M:-}
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-90}
      WEB_BASIC_AUTH: ${WEB_BASIC_AUTH:-}
      WEB_AUTH_SETTINGS_ONLY: ${WEB_AUTH_SETTINGS_ONLY:-}
      SITE_NAME: ${SITE_NAME:-}
      POLLER_URL: http://poller:8780
      CONTROL_TOKEN: ${CONTROL_TOKEN:-${INFLUX_TOKEN}}
      MCP_TOKEN: ${MCP_TOKEN:-}
      TARIFF_CURRENCY: ${TARIFF_CURRENCY:-UAH}
      TARIFF_DAY: ${TARIFF_DAY:-}
      TARIFF_NIGHT: ${TARIFF_NIGHT:-}
      TARIFF_NIGHT_START: ${TARIFF_NIGHT_START:-23:00}
      TARIFF_NIGHT_END: ${TARIFF_NIGHT_END:-07:00}
      TARIFF_FILE: /data/tariff.json
      LAYOUT_FILE: /data/overview-layout.json   # the Overview's cards, chosen with Customize
      AUTH_FILE: /data/auth.json          # a dashboard password changed on the Settings page (kept as a hash)
      # "Check for updates" on the Settings page (release installs only; see web/backend/app/updates.py)
      SOLIS_VERSION: ${SOLIS_VERSION:-}
      SOLIS_REPO: ${SOLIS_REPO:-}
      UPDATE_DIR: /control
      UPDATE_CHECK_HOURS: ${UPDATE_CHECK_HOURS:-6}
      BACKUP_DIR: /backups
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - web-data:/data        # tariff changes saved from the Settings page
      - ./control:/control    # requests to and progress from the host's updater and backup helper; no Docker access for this container
      - ./backups:/backups:ro # the archives `solis-monitor backup` writes, so the Settings page can list and download them

volumes:
  influxdb-data:
  influxdb-config:
  web-data:
  poller-data:
